<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- 背景装饰圆 -->
  <circle cx="200" cy="150" r="130" fill="#eff6ff" opacity="0.5"/>
  <circle cx="200" cy="150" r="100" fill="#dbeafe" opacity="0.5"/>

  <!-- 书架 -->
  <rect x="80" y="200" width="240" height="10" rx="2" fill="#64748b"/>

  <!-- 书本1 - 蓝色 -->
  <g transform="translate(95, 80)">
    <rect x="0" y="20" width="50" height="100" rx="3" fill="#2563eb"/>
    <rect x="4" y="24" width="42" height="92" rx="2" fill="#3b82f6"/>
    <rect x="10" y="35" width="30" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="10" y="45" width="25" height="3" rx="1" fill="white" opacity="0.6"/>
    <rect x="10" y="53" width="20" height="3" rx="1" fill="white" opacity="0.4"/>
  </g>

  <!-- 书本2 - 绿色 -->
  <g transform="translate(150, 70)">
    <rect x="0" y="10" width="55" height="120" rx="3" fill="#059669"/>
    <rect x="4" y="14" width="47" height="112" rx="2" fill="#10b981"/>
    <circle cx="27" cy="50" r="15" fill="white" opacity="0.2"/>
    <rect x="12" y="80" width="32" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="12" y="90" width="28" height="3" rx="1" fill="white" opacity="0.6"/>
  </g>

  <!-- 书本3 - 橙色 -->
  <g transform="translate(210, 85)">
    <rect x="0" y="25" width="45" height="95" rx="3" fill="#d97706"/>
    <rect x="4" y="29" width="37" height="87" rx="2" fill="#f59e0b"/>
    <rect x="10" y="45" width="22" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="10" y="55" width="18" height="3" rx="1" fill="white" opacity="0.6"/>
    <rect x="10" y="63" width="22" height="3" rx="1" fill="white" opacity="0.4"/>
  </g>

  <!-- 书本4 - 紫色（倾斜） -->
  <g transform="translate(260, 95) rotate(-8)">
    <rect x="0" y="15" width="48" height="90" rx="3" fill="#7c3aed"/>
    <rect x="4" y="19" width="40" height="82" rx="2" fill="#8b5cf6"/>
    <rect x="10" y="35" width="25" height="4" rx="1" fill="white" opacity="0.9"/>
    <rect x="10" y="45" width="20" height="3" rx="1" fill="white" opacity="0.6"/>
  </g>

  <!-- 装饰元素 -->
  <circle cx="330" cy="70" r="6" fill="#2563eb" opacity="0.3"/>
  <circle cx="70" cy="100" r="8" fill="#10b981" opacity="0.3"/>
  <circle cx="340" cy="160" r="5" fill="#f59e0b" opacity="0.4"/>
  <circle cx="60" cy="180" r="4" fill="#8b5cf6" opacity="0.3"/>

  <!-- 铅笔 -->
  <g transform="translate(300, 140) rotate(30)">
    <rect x="0" y="0" width="8" height="50" fill="#fbbf24"/>
    <polygon points="0,50 4,60 8,50" fill="#f59e0b"/>
    <rect x="0" y="0" width="8" height="8" fill="#ec4899"/>
    <polygon points="4,60 2,65 6,65" fill="#374151"/>
  </g>
</svg>