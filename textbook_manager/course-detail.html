<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="课程详情 - 前端外语教材学习系统">
    <title>课程详情</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/course-detail.css">
</head>
<body>
    <!-- ========== 导航栏 ========== -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">
                <img src="images/logo.svg" alt="Logo">
                <span>外语教材学习系统</span>
            </a>

            <button class="navbar-toggle" aria-label="切换菜单">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="navbar-center-logo">
                <img src="images/Logo.png" alt="Center Logo">
                <!-- 或者用占位符 -->
                <!-- <div class="logo-placeholder">LOGO</div> -->
            </div>

            <ul class="navbar-menu">
                <li><a href="index.html" class="navbar-link">首页</a></li>
                <li><a href="textbooks.html" class="navbar-link active">教材</a></li>
                <li><a href="notes.html" class="navbar-link">笔记</a></li>
                <li><a href="vocabulary.html" class="navbar-link">生词</a></li>
            </ul>
        </div>
    </nav>

    <!-- ========== 主内容区域 ========== -->
    <main class="main-content">
        <!-- 面包屑导航 -->
        <nav class="breadcrumb">
            <a href="index.html">首页</a>
            <span class="breadcrumb-separator">/</span>
            <a href="textbooks.html">教材管理</a>
            <span class="breadcrumb-separator">/</span>
            <a href="#" id="breadcrumb-textbook">教材</a>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current" id="breadcrumb-current">课程详情</span>
        </nav>

        <!-- 课程信息头部 -->
        <div class="card mb-3" id="course-header">
            <div class="course-info">
                <div class="course-info-main">
                    <div class="course-title-row">
                        <span class="course-number-large" id="course-number">1</span>
                        <div>
                            <h1 class="page-title" id="course-name">加载中...</h1>
                            <p class="page-subtitle" id="course-description"></p>
                        </div>
                    </div>
                </div>
                <div class="course-info-actions">
                    <button class="btn btn-secondary" id="edit-course-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                        编辑课程
                    </button>
                </div>
            </div>
            <div class="course-stats mt-2">
                <span class="tag tag-primary">
                    所属教材：<span id="textbook-name">-</span>
                </span>
                <span class="tag tag-success">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                    </svg>
                    <span id="lesson-count">0</span> 篇课文
                </span>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="card mb-3">
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="search-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="M21 21l-4.35-4.35"></path>
                        </svg>
                        <input type="text" id="search-input" placeholder="搜索课文标题...">
                    </div>

                    <!-- 类型筛选 -->
                    <select class="filter-select" id="filter-type">
                        <option value="">所有类型</option>
                        <option value="dialogue">对话式</option>
                        <option value="article">整体式</option>
                    </select>
                </div>

                <button class="btn btn-primary" id="add-lesson-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    添加课文
                </button>
            </div>
        </div>

        <!-- 课文列表 -->
        <div id="lesson-list" class="card-grid">
            <!-- 课文卡片将通过 JS 动态加载 -->
        </div>

        <!-- 空状态 -->
        <div id="empty-state" class="empty-state card" style="display: none;">
            <img src="images/empty-state.svg" alt="暂无数据">
            <h3>暂无课文</h3>
            <p>点击上方"添加课文"按钮，为这个课程创建第一篇课文</p>
            <button class="btn btn-primary" id="empty-add-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                添加第一篇课文
            </button>
        </div>
    </main>

    <!-- ========== 编辑课程模态框 ========== -->
    <div class="modal-overlay" id="course-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">编辑课程</h2>
                <button class="modal-close" id="course-modal-close" aria-label="关闭">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <form id="course-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label" for="edit-course-name">
                            课程名称 <span class="required">*</span>
                        </label>
                        <input type="text" class="form-input" id="edit-course-name"
                               placeholder="请输入课程名称" required maxlength="100">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="edit-course-description">
                            课程描述
                        </label>
                        <textarea class="form-textarea" id="edit-course-description"
                                  placeholder="请输入课程描述..." maxlength="500"
                                  style="min-height: 80px;"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="edit-course-order">
                            排序序号
                        </label>
                        <input type="number" class="form-input" id="edit-course-order"
                               placeholder="输入数字，数字越小越靠前" min="0" max="9999">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="course-modal-cancel">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========== 添加课文模态框（选择类型） ========== -->
    <div class="modal-overlay" id="add-lesson-modal">
        <div class="modal" style="max-width: 550px;">
            <div class="modal-header">
                <h2 class="modal-title">添加课文</h2>
                <button class="modal-close" id="add-lesson-modal-close" aria-label="关闭">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="modal-body">
                <p class="mb-3" style="color: var(--text-secondary);">请选择课文类型：</p>

                <div class="lesson-type-cards">
                    <!-- 对话式 -->
                    <div class="lesson-type-card" data-type="dialogue">
                        <div class="lesson-type-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                        </div>
                        <h3 class="lesson-type-title">对话式</h3>
                        <p class="lesson-type-description">
                            类似微信聊天的对话形式，适合录入人物对话、剧本等内容
                        </p>
                        <div class="lesson-type-preview">
                            <div class="preview-bubble left">Hello!</div>
                            <div class="preview-bubble right">Hi there!</div>
                        </div>
                    </div>

                    <!-- 整体式 -->
                    <div class="lesson-type-card" data-type="article">
                        <div class="lesson-type-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                        </div>
                        <h3 class="lesson-type-title">整体式</h3>
                        <p class="lesson-type-description">
                            类似 Word 文档的文章形式，支持富文本编辑
                        </p>
                        <div class="lesson-type-preview">
                            <div class="preview-line" style="width: 100%;"></div>
                            <div class="preview-line" style="width: 80%;"></div>
                            <div class="preview-line" style="width: 90%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="add-lesson-modal-cancel">取消</button>
            </div>
        </div>
    </div>

    <!-- ========== 确认删除模态框 ========== -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h2 class="modal-title">确认删除</h2>
                <button class="modal-close" id="confirm-modal-close" aria-label="关闭">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p id="confirm-message">确定要删除这篇课文吗？此操作不可恢复。</p>
                <input type="hidden" id="delete-lesson-id">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="confirm-modal-cancel">取消</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-btn">确认删除</button>
            </div>
        </div>
    </div>

    <!-- ========== 页脚 ========== -->
    <footer class="footer">
        <p>© 2025 Asano Hoshiya | 数据存储于本地浏览器</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/course-detail.js"></script>
</body>
</html>
